services:
  - type: web
    name: prismcheck-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn --app-dir backend app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: PRISMCHECK_COOKIE_SECURE
        value: "true"
      - key: PRISMCHECK_SECRET
        generateValue: true
